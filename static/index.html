<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lifty — technique feedback</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #191b20;
    --panel2: #22252c;
    --text: #eceef1;
    --muted: #9aa1ab;
    --accent: #e8843a;
    --accent-press: #c96e2b;
    --good: #4caf7d;
    --bad: #e05555;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
  h1 { font-size: 26px; letter-spacing: -0.5px; }
  h1 .bar { color: var(--accent); }
  header small { color: var(--muted); }
  .section-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 18px 0 8px; }
  .lifts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lift-btn {
    background: var(--panel); color: var(--text); border: 1.5px solid transparent;
    border-radius: var(--radius); padding: 12px 10px; font-size: 14.5px; font-weight: 600;
    text-align: left; cursor: pointer; line-height: 1.3;
  }
  .lift-btn.selected { border-color: var(--accent); background: var(--panel2); }
  textarea {
    width: 100%; background: var(--panel); border: 1.5px solid transparent; border-radius: var(--radius);
    color: var(--text); padding: 12px; font: inherit; font-size: 15px; resize: none; height: 64px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .video-row { display: flex; gap: 8px; align-items: center; }
  .file-btn {
    flex: 1; background: var(--panel); border: 1.5px dashed #3a3f49; border-radius: var(--radius);
    color: var(--muted); padding: 14px; font-size: 15px; font-weight: 600; text-align: center; cursor: pointer;
  }
  .file-btn.has-file { border-style: solid; border-color: var(--good); color: var(--text); }
  input[type=file] { display: none; }
  #analyze {
    width: 100%; margin-top: 18px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); padding: 16px; font-size: 17px; font-weight: 700; cursor: pointer;
  }
  #analyze:active { background: var(--accent-press); }
  #analyze:disabled { background: #3a3f49; color: var(--muted); }
  #status { margin-top: 14px; color: var(--muted); font-size: 14px; min-height: 20px; }
  #status .spinner {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted);
    border-top-color: transparent; border-radius: 50%; margin-right: 8px; vertical-align: -1px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #feedback {
    margin-top: 16px; background: var(--panel); border-radius: var(--radius);
    padding: 16px 18px; display: none; word-wrap: break-word;
  }
  #feedback.visible { display: block; }
  #feedback h2 { font-size: 17px; color: var(--accent); margin: 14px 0 6px; }
  #feedback h2:first-child { margin-top: 0; }
  #feedback ul { padding-left: 20px; margin: 6px 0; }
  #feedback li { margin: 4px 0; }
  #feedback p { margin: 6px 0; }
  #feedback strong { color: #fff; }
  #feedback em { color: var(--muted); }
  .error { color: var(--bad); }
  footer { margin-top: 22px; color: #565c66; font-size: 12.5px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Lifty <span class="bar">/</span></h1>
  <small>film · upload · fix · lift</small>
</header>

<div class="section-label">Lift</div>
<div class="lifts" id="lifts"></div>

<div class="section-label">Video of the set</div>
<div class="video-row">
  <label class="file-btn" id="fileLabel" for="videoInput">🎥 Record or choose video</label>
  <input type="file" id="videoInput" accept="video/*">
</div>

<div class="section-label">Notes for the coach (optional)</div>
<textarea id="notes" placeholder="e.g. 80kg, felt slow off the floor, 3rd set"></textarea>

<button id="analyze" disabled>Get feedback</button>
<div id="status"></div>
<article id="feedback"></article>

<footer>Frames from your video are analysed by Claude. Keep clips short (5–30&nbsp;s), whole body + bar in frame, filmed from the side or a 45° angle.</footer>

<script>
(function () {
  "use strict";
  var selectedLift = null;
  var liftsEl = document.getElementById("lifts");
  var videoInput = document.getElementById("videoInput");
  var fileLabel = document.getElementById("fileLabel");
  var analyzeBtn = document.getElementById("analyze");
  var statusEl = document.getElementById("status");
  var feedbackEl = document.getElementById("feedback");
  var notesEl = document.getElementById("notes");

  // Stable per-browser session id so the coach remembers your previous set.
  var sessionId = localStorage.getItem("lifty_session");
  if (!sessionId) {
    sessionId = "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("lifty_session", sessionId);
  }

  fetch("/api/lifts").then(function (r) { return r.json(); }).then(function (lifts) {
    lifts.forEach(function (lift) {
      var btn = document.createElement("button");
      btn.className = "lift-btn";
      btn.textContent = lift.label;
      btn.onclick = function () {
        selectedLift = lift.key;
        Array.prototype.forEach.call(liftsEl.children, function (b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        updateButton();
      };
      liftsEl.appendChild(btn);
    });
    var last = localStorage.getItem("lifty_lift");
    var idx = lifts.findIndex(function (l) { return l.key === last; });
    if (idx >= 0) liftsEl.children[idx].click();
  });

  videoInput.onchange = function () {
    var f = videoInput.files[0];
    if (f) {
      fileLabel.textContent = "✅ " + (f.name || "video") + " (" + (f.size / 1e6).toFixed(1) + " MB)";
      fileLabel.classList.add("has-file");
    } else {
      fileLabel.textContent = "🎥 Record or choose video";
      fileLabel.classList.remove("has-file");
    }
    updateButton();
  };

  function updateButton() {
    analyzeBtn.disabled = !(selectedLift && videoInput.files.length);
  }

  function setStatus(html) { statusEl.innerHTML = html; }

  // Minimal markdown renderer for the ## / ** / - subset the coach uses.
  function renderMarkdown(md) {
    var esc = md.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    var lines = esc.split("\n");
    var html = "", inList = false;
    lines.forEach(function (line) {
      var isItem = /^\s*[-*]\s+/.test(line);
      if (inList && !isItem) { html += "</ul>"; inList = false; }
      if (/^##\s+/.test(line)) {
        html += "<h2>" + line.replace(/^##\s+/, "") + "</h2>";
      } else if (isItem) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + line.replace(/^\s*[-*]\s+/, "") + "</li>";
      } else if (line.trim() === "") {
        html += "";
      } else {
        html += "<p>" + line + "</p>";
      }
    });
    if (inList) html += "</ul>";
    return html
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }

  analyzeBtn.onclick = async function () {
    var file = videoInput.files[0];
    if (!file || !selectedLift) return;
    localStorage.setItem("lifty_lift", selectedLift);

    analyzeBtn.disabled = true;
    feedbackEl.className = "visible";
    feedbackEl.innerHTML = "";
    setStatus('<span class="spinner"></span>Uploading video…');

    var form = new FormData();
    form.append("video", file);
    form.append("lift", selectedLift);
    form.append("notes", notesEl.value);
    form.append("session_id", sessionId);

    try {
      var resp = await fetch("/api/analyze", { method: "POST", body: form });
      if (!resp.ok) {
        var detail = "Request failed (" + resp.status + ")";
        try { detail = (await resp.json()).detail || detail; } catch (e) {}
        throw new Error(detail);
      }
      setStatus('<span class="spinner"></span>Coach is reviewing your frames…');
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var acc = "";
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        if (acc === "") setStatus('<span class="spinner"></span>Writing feedback…');
        acc += decoder.decode(chunk.value, { stream: true });
        feedbackEl.innerHTML = renderMarkdown(acc);
      }
      setStatus(acc ? "Done — good luck with the next set 💪" : "No feedback returned.");
    } catch (err) {
      setStatus('<span class="error">' + err.message + "</span>");
    } finally {
      analyzeBtn.disabled = false;
      updateButton();
    }
  };
})();
</script>
</body>
</html>
